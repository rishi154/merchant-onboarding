required_documents:
  GmbH:
    - handelsregister
    - gesellschaftsvertrag
    - vat_certificate
  SAS:
    - kbis
    - statuts
    - vat_certificate
  BV:
    - kvk_uittreksel
    - statuten
    - vat_certificate

compliance_rules:
  - GDPR
  - PSD2
  - 5AMLD
  - MiFID_II

